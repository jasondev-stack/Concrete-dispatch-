<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concrete Dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0f1923;
    --surface:  #1a2635;
    --surface2: #1e2f42;
    --border:   #2a3a4d;
    --text:     #e8eef5;
    --muted:    #6b8099;
    --accent:   #f4a820;
    --header-h: 66px;
    --legend-h: 44px;

    /* Plant colours — distinct, no red/green */
    --c-albany:   #7b5ea7;   /* purple      */
    --c-denmark:  #1a7fa8;   /* teal-blue   */
    --c-kendenup: #c47c1a;   /* burnt amber */

    /* Other statuses */
    --c-standby: #3a5068;
    --c-oos:     #181f27;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 12px;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }
  .logo span { color: var(--text); font-weight: 400; }

  .header-center { display: flex; align-items: center; gap: 8px; }
  .header-right  { display: flex; align-items: center; gap: 10px; }

  .nav-btn {
    background: var(--border);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .nav-btn:hover { background: var(--accent); border-color: var(--accent); color: #000; }

  .week-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    min-width: 190px;
    text-align: center;
    white-space: nowrap;
  }

  .hdr-btn {
    background: var(--border);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 13px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .hdr-btn:hover { background: var(--surface2); border-color: var(--muted); }
  .hdr-btn.today { border-color: var(--accent); color: var(--accent); }
  .hdr-btn.today:hover { background: var(--accent); color: #000; }
  .hdr-btn.fleet { border-color: #4a6a8a; }
  .hdr-btn.fleet:hover { background: #1e3a52; border-color: var(--text); }

  .save-dot { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .save-dot.saved { color: #56c16b; }

  /* ── LEGEND ── */
  .legend {
    height: var(--legend-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 6px;
    overflow-x: auto;
  }
  .leg-label {
    font-size: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
    margin-right: 2px;
  }
  .leg-sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; flex-shrink: 0; }
  .leg-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; white-space: nowrap; flex-shrink: 0;
    padding: 3px 8px; border-radius: 4px;
  }
  .leg-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

  /* ── TABLE ── */
  .table-wrap { padding: 20px; overflow-x: auto; }

  table { border-collapse: collapse; min-width: 840px; width: 100%; }

  thead th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted);
    padding: 10px 6px;
    border-bottom: 2px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: calc(var(--header-h) + var(--legend-h));
    z-index: 10;
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; padding-left: 14px; min-width: 145px; }
  .day-header { text-align: center; min-width: 112px; }
  .day-name { font-size: 13px; color: var(--text); }
  .day-date { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .day-header.today-col .day-name { color: var(--accent); }
  .day-header.today-col .day-date { color: var(--accent); opacity: 0.8; }

  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:not(.oos-row):hover { background: rgba(255,255,255,0.015); }
  tbody tr.oos-row { opacity: 0.5; }

  .truck-cell {
    padding: 9px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    white-space: nowrap;
    border-right: 2px solid var(--border);
  }
  .truck-num  { font-size: 10px; color: var(--accent); letter-spacing: 1px; }
  .truck-num.dimmed { color: var(--muted); }
  .truck-name { font-size: 14px; color: var(--text); line-height: 1.2; }
  .truck-oos-badge {
    display: inline-block;
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    background: #2a1515; color: #d04040;
    border: 1px solid #4a2020;
    border-radius: 3px; padding: 1px 5px; margin-top: 3px;
  }

  .day-cell {
    padding: 5px; text-align: center;
    border-right: 1px solid var(--border);
    position: relative;
  }
  .day-cell.today-col { background: rgba(244,168,32,0.03); }

  .cell-inner {
    border-radius: 6px; min-height: 52px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: filter 0.12s, transform 0.1s;
    border: 2px solid transparent;
    padding: 4px;
  }
  .cell-inner:not(.oos-cell):hover { filter: brightness(1.2); transform: scale(1.03); }
  .cell-inner.active { border-color: rgba(255,255,255,0.75); box-shadow: 0 0 0 2px rgba(255,255,255,0.18); }
  .cell-inner.oos-cell {
    background: var(--c-oos) !important;
    cursor: default;
    border: 1px dashed #2e3e50 !important;
  }

  .cell-text {
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    line-height: 1.3; word-break: break-word;
  }
  .cell-sub {
    font-size: 9px; color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;
  }
  .oos-label-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 2px; color: #2e3e50;
  }

  /* colour classes */
  .bg-albany   { background: var(--c-albany); }
  .bg-denmark  { background: var(--c-denmark); }
  .bg-kendenup { background: var(--c-kendenup); }
  .bg-standby  { background: var(--c-standby); }
  .bg-empty    { background: rgba(255,255,255,0.03); border: 1px dashed #2a3a4d !important; }

  /* ── CELL POPUP ── */
  .cell-popup {
    position: absolute;
    top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    z-index: 300;
    background: #1c2c3e;
    border: 1px solid #3a5060;
    border-radius: 10px;
    box-shadow: 0 10px 36px rgba(0,0,0,0.6);
    padding: 10px; min-width: 215px;
    display: none;
  }
  .cell-popup.open { display: block; animation: popIn 0.13s ease-out; }
  @keyframes popIn {
    from { opacity:0; transform: translateX(-50%) scale(0.9) translateY(-5px); }
    to   { opacity:1; transform: translateX(-50%) scale(1)   translateY(0); }
  }

  .popup-input {
    width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 6px 9px; border-radius: 6px;
    font-family: 'Barlow', sans-serif; font-size: 13px;
    margin-bottom: 8px; outline: none;
  }
  .popup-input:focus { border-color: var(--accent); }

  .popup-options { display: flex; flex-direction: column; gap: 3px; }
  .popup-option {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: background 0.1s;
    border: none; background: none; color: var(--text);
    text-align: left; width: 100%;
  }
  .popup-option:hover { background: rgba(255,255,255,0.07); }
  .opt-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .popup-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
  .popup-clear {
    width: 100%; background: none;
    border: 1px solid var(--border); color: var(--muted);
    padding: 5px; border-radius: 6px; font-size: 12px;
    cursor: pointer; font-family: 'Barlow', sans-serif;
    transition: border-color 0.1s, color 0.1s;
  }
  .popup-clear:hover { border-color: #d04040; color: #d04040; }

  /* ── FLEET PANEL ── */
  .fleet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: none; align-items: flex-start; justify-content: flex-end;
    z-index: 500;
  }
  .fleet-overlay.open { display: flex; }

  .fleet-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    width: 430px; max-width: 100vw;
    height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
    animation: slideIn 0.2s ease-out;
  }
  @keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  .fleet-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0;
    background: var(--surface); z-index: 10;
  }
  .fleet-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 800;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent);
  }
  .fleet-subtitle {
    font-size: 11px; color: var(--muted);
    margin-top: 2px; letter-spacing: 0.3px;
  }
  .fleet-close {
    background: none; border: 1px solid var(--border);
    color: var(--muted); width: 30px; height: 30px;
    border-radius: 6px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.1s, color 0.1s;
  }
  .fleet-close:hover { border-color: var(--text); color: var(--text); }

  .fleet-body { padding: 14px 16px; flex: 1; }

  .fleet-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px; margin-top: 4px;
  }

  .fleet-truck {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 13px;
    margin-bottom: 7px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.15s;
  }
  .fleet-truck.is-oos { border-color: #3a2020; background: #171e27; }

  .fleet-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--accent); letter-spacing: 1px;
    min-width: 38px;
  }
  .fleet-num.dimmed { color: var(--muted); }

  .fleet-inputs { flex: 1; display: flex; flex-direction: column; gap: 5px; }

  .fleet-name-input {
    width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 5px 9px; border-radius: 5px;
    font-family: 'Barlow', sans-serif; font-size: 13px; outline: none;
    transition: border-color 0.1s;
  }
  .fleet-name-input:focus { border-color: var(--accent); }
  .fleet-name-input.struck { color: var(--muted); text-decoration: line-through; }

  .oos-row { display: flex; align-items: center; gap: 8px; }

  .oos-toggle {
    appearance: none; -webkit-appearance: none;
    width: 34px; height: 19px;
    background: var(--border); border-radius: 10px;
    cursor: pointer; position: relative;
    transition: background 0.2s; flex-shrink: 0;
  }
  .oos-toggle::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 13px; height: 13px;
    background: var(--muted); border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .oos-toggle:checked { background: #4a1a1a; }
  .oos-toggle:checked::after { transform: translateX(15px); background: #d04040; }

  .oos-lbl { font-size: 12px; color: var(--muted); user-select: none; }
  .oos-toggle:checked ~ .oos-lbl { color: #d04040; }

  .add-section {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .add-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-row input {
    flex: 1; background: var(--bg);
    border: 1px solid var(--border); color: var(--text);
    padding: 7px 9px; border-radius: 6px;
    font-size: 13px; font-family: 'Barlow', sans-serif; outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row .add-id { max-width: 80px; }
  .add-btn {
    background: var(--accent); border: none; color: #000;
    padding: 7px 14px; border-radius: 6px; cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    white-space: nowrap; transition: opacity 0.1s;
  }
  .add-btn:hover { opacity: 0.88; }

  .fleet-footer {
    padding: 14px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .fleet-footer button {
    flex: 1; padding: 10px; border-radius: 7px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; border: none;
  }
  .btn-save   { background: var(--accent); color: #000; }
  .btn-cancel { background: var(--border); color: var(--text); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">🚛 <span>Concrete</span>Dispatch</div>
  <div class="header-center">
    <button class="nav-btn" id="prevWeek">&#8592;</button>
    <div class="week-label" id="weekLabel"></div>
    <button class="nav-btn" id="nextWeek">&#8594;</button>
    <button class="hdr-btn today" id="todayBtn">Today</button>
  </div>
  <div class="header-right">
    <button class="hdr-btn fleet" id="fleetBtn">⚙ Fleet</button>
    <div class="save-dot" id="saveDot">● saved</div>
  </div>
</header>

<!-- LEGEND -->
<div class="legend">
  <span class="leg-label">Plants</span>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-albany)"></div>Albany</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-denmark)"></div>Denmark</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-kendenup)"></div>Kendenup</div>
  <div class="leg-sep"></div>
  <span class="leg-label">Status</span>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-standby)"></div>Standby</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-oos);border:1px solid #2e3e50"></div>Out of Service</div>
</div>

<!-- TABLE -->
<div class="table-wrap">
  <table id="scheduleTable">
    <thead><tr id="headerRow"><th>Truck</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- FLEET PANEL -->
<div class="fleet-overlay" id="fleetOverlay">
  <div class="fleet-panel">
    <div class="fleet-header">
      <div>
        <div class="fleet-title">Fleet Management</div>
        <div class="fleet-subtitle">Rename trucks · Mark out of service</div>
      </div>
      <button class="fleet-close" id="fleetClose">✕</button>
    </div>
    <div class="fleet-body" id="fleetBody"></div>
    <div class="fleet-footer">
      <button class="btn-cancel" id="fleetCancelBtn">Cancel</button>
      <button class="btn-save"   id="fleetSaveBtn">Save Changes</button>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const STATUSES = [
  { label: 'Albany',   cls: 'bg-albany',   color: '#7b5ea7' },
  { label: 'Denmark',  cls: 'bg-denmark',  color: '#1a7fa8' },
  { label: 'Kendenup', cls: 'bg-kendenup', color: '#c47c1a' },
  { label: 'Standby',  cls: 'bg-standby',  color: '#3a5068' },
];

const DEFAULT_TRUCKS = Array.from({length: 11}, (_, i) => ({
  id:  `T-${String(i+1).padStart(2,'0')}`,
  name: `Truck ${i+1}`,
  oos: false
}));

// ─── STATE ────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'concrete_dispatch_v2';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.trucks = s.trucks.map(t => ({ oos: false, ...t }));
      return s;
    }
  } catch(e) {}
  return { trucks: DEFAULT_TRUCKS.map(t => ({...t})), schedule: {} };
}

let state = loadState();
let saveTimer = null;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const el = document.getElementById('saveDot');
  el.textContent = '✓ saved';
  el.className = 'save-dot saved';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    el.textContent = '● saved';
    el.className = 'save-dot';
  }, 2000);
}

// ─── DATE HELPERS ─────────────────────────────────────────────────────────────
let currentWeekStart = getWeekStart(new Date());

function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  d.setHours(0,0,0,0);
  return d;
}
function addDays(date, n) {
  const d = new Date(date); d.setDate(d.getDate() + n); return d;
}
function fmtDate(d) { return d.toISOString().slice(0,10); }
function fmtDisp(d) { return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}); }
function isToday(d) { return fmtDate(d) === fmtDate(new Date()); }

const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// ─── RENDER TABLE ─────────────────────────────────────────────────────────────
function render() {
  const days = Array.from({length:7}, (_,i) => addDays(currentWeekStart, i));

  document.getElementById('weekLabel').textContent =
    `${fmtDisp(days[0])} – ${fmtDisp(days[6])}`;

  // Header
  const hr = document.getElementById('headerRow');
  hr.innerHTML = '<th>Truck</th>';
  days.forEach((d, i) => {
    const th = document.createElement('th');
    th.className = 'day-header' + (isToday(d) ? ' today-col' : '');
    th.innerHTML = `<div class="day-name">${DAY_NAMES[i]}</div><div class="day-date">${fmtDisp(d)}</div>`;
    hr.appendChild(th);
  });

  // Body
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  state.trucks.forEach(truck => {
    const tr = document.createElement('tr');
    if (truck.oos) tr.classList.add('oos-row');

    // Truck label
    const tc = document.createElement('td');
    tc.className = 'truck-cell';
    tc.innerHTML = `
      <div class="truck-num${truck.oos ? ' dimmed' : ''}">${truck.id}</div>
      <div class="truck-name">${escHtml(truck.name)}</div>
      ${truck.oos ? '<div class="truck-oos-badge">OOS</div>' : ''}
    `;
    tr.appendChild(tc);

    // Day cells
    days.forEach(d => {
      const key = `${fmtDate(d)}|${truck.id}`;
      const data = state.schedule[key] || { status: null, label: '' };
      const statusObj = STATUSES.find(s => s.label === data.status);

      const td = document.createElement('td');
      td.className = 'day-cell' + (isToday(d) ? ' today-col' : '');

      const inner = document.createElement('div');
      inner.dataset.key = key;

      if (truck.oos) {
        inner.className = 'cell-inner oos-cell';
        inner.innerHTML = '<div class="oos-label-text">OOS</div>';
      } else {
        inner.className = 'cell-inner ' + (statusObj ? statusObj.cls : 'bg-empty');

        const textDiv = document.createElement('div');
        textDiv.className = 'cell-text';
        textDiv.textContent = data.label || (statusObj ? statusObj.label : '');

        const subDiv = document.createElement('div');
        subDiv.className = 'cell-sub';
        if (data.label && statusObj) subDiv.textContent = statusObj.label;

        inner.appendChild(textDiv);
        inner.appendChild(subDiv);

        const popup = buildPopup(key, data);
        inner.appendChild(popup);

        inner.addEventListener('click', e => {
          e.stopPropagation();
          const wasOpen = popup.classList.contains('open');
          closeAllPopups();
          if (!wasOpen) {
            popup.classList.add('open');
            inner.classList.add('active');
            popup.querySelector('.popup-input').focus();
          }
        });
      }

      td.appendChild(inner);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

// ─── BUILD POPUP ──────────────────────────────────────────────────────────────
function buildPopup(key, data) {
  const popup = document.createElement('div');
  popup.className = 'cell-popup';

  const input = document.createElement('input');
  input.className = 'popup-input';
  input.placeholder = 'Type job / site note…';
  input.value = data.label || '';
  input.addEventListener('input', e => updateCellData(key, data.status, e.target.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') closeAllPopups(); });
  input.addEventListener('click', e => e.stopPropagation());
  popup.appendChild(input);

  const opts = document.createElement('div');
  opts.className = 'popup-options';
  STATUSES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'popup-option';
    btn.innerHTML = `<span class="opt-dot" style="background:${s.color}"></span>${s.label}`;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      data.status = s.label;
      updateCellData(key, s.label, input.value);
      render();
      closeAllPopups();
    });
    opts.appendChild(btn);
  });
  popup.appendChild(opts);

  const hr = document.createElement('hr');
  hr.className = 'popup-divider';
  popup.appendChild(hr);

  const clearBtn = document.createElement('button');
  clearBtn.className = 'popup-clear';
  clearBtn.textContent = 'Clear cell';
  clearBtn.addEventListener('click', e => {
    e.stopPropagation();
    delete state.schedule[key];
    saveState();
    render();
    closeAllPopups();
  });
  popup.appendChild(clearBtn);

  return popup;
}

function updateCellData(key, status, label) {
  state.schedule[key] = { status, label };
  saveState();
  // live-update colours without full render
  const inner = document.querySelector(`.cell-inner[data-key="${key}"]`);
  if (!inner || inner.classList.contains('oos-cell')) return;
  STATUSES.forEach(s => inner.classList.remove(s.cls));
  inner.classList.remove('bg-empty');
  const so = STATUSES.find(s => s.label === status);
  inner.classList.add(so ? so.cls : 'bg-empty');
  const t = inner.querySelector('.cell-text');
  const sub = inner.querySelector('.cell-sub');
  if (t) t.textContent = label || (so ? so.label : '');
  if (sub) sub.textContent = (label && so) ? so.label : '';
}

function closeAllPopups() {
  document.querySelectorAll('.cell-popup.open').forEach(p => {
    p.classList.remove('open');
    p.parentElement?.classList.remove('active');
  });
}
document.addEventListener('click', closeAllPopups);

// ─── WEEK NAV ─────────────────────────────────────────────────────────────────
document.getElementById('prevWeek').addEventListener('click', () => { currentWeekStart = addDays(currentWeekStart,-7); render(); });
document.getElementById('nextWeek').addEventListener('click', () => { currentWeekStart = addDays(currentWeekStart, 7); render(); });
document.getElementById('todayBtn').addEventListener('click', () => { currentWeekStart = getWeekStart(new Date()); render(); });

// ─── FLEET PANEL ──────────────────────────────────────────────────────────────
let fleetDraft = [];

function openFleet() {
  fleetDraft = state.trucks.map(t => ({...t}));
  renderFleetPanel();
  document.getElementById('fleetOverlay').classList.add('open');
}

function closeFleet() {
  document.getElementById('fleetOverlay').classList.remove('open');
}

function renderFleetPanel() {
  const body = document.getElementById('fleetBody');
  body.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'fleet-section-title';
  title.textContent = 'Active Fleet';
  body.appendChild(title);

  fleetDraft.forEach((truck, idx) => {
    const row = document.createElement('div');
    row.className = 'fleet-truck' + (truck.oos ? ' is-oos' : '');

    // ID badge
    const numDiv = document.createElement('div');
    numDiv.className = 'fleet-num' + (truck.oos ? ' dimmed' : '');
    numDiv.textContent = truck.id;
    row.appendChild(numDiv);

    // Inputs
    const inputsDiv = document.createElement('div');
    inputsDiv.className = 'fleet-inputs';

    const nameInput = document.createElement('input');
    nameInput.className = 'fleet-name-input' + (truck.oos ? ' struck' : '');
    nameInput.value = truck.name;
    nameInput.placeholder = 'Truck name';
    nameInput.addEventListener('input', e => { fleetDraft[idx].name = e.target.value; });
    inputsDiv.appendChild(nameInput);

    // OOS toggle
    const oosRowDiv = document.createElement('div');
    oosRowDiv.className = 'oos-row';

    const toggleId = `oos-toggle-${idx}`;
    const toggle = document.createElement('input');
    toggle.type = 'checkbox';
    toggle.id = toggleId;
    toggle.className = 'oos-toggle';
    toggle.checked = !!truck.oos;
    toggle.addEventListener('change', e => {
      fleetDraft[idx].oos = e.target.checked;
      renderFleetPanel();
    });

    const lbl = document.createElement('label');
    lbl.className = 'oos-lbl';
    lbl.htmlFor = toggleId;
    lbl.textContent = 'Out of Service';

    oosRowDiv.appendChild(toggle);
    oosRowDiv.appendChild(lbl);
    inputsDiv.appendChild(oosRowDiv);

    row.appendChild(inputsDiv);
    body.appendChild(row);
  });

  // Add truck section
  const addSec = document.createElement('div');
  addSec.className = 'add-section';

  const addTitle = document.createElement('div');
  addTitle.className = 'fleet-section-title';
  addTitle.textContent = 'Add New Truck';
  addSec.appendChild(addTitle);

  const addRow = document.createElement('div');
  addRow.className = 'add-row';

  const idIn = document.createElement('input');
  idIn.className = 'add-id';
  idIn.placeholder = 'ID e.g. T-12';

  const nameIn = document.createElement('input');
  nameIn.placeholder = 'Name / description';

  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ Add';
  addBtn.addEventListener('click', () => {
    const id   = idIn.value.trim();
    const name = nameIn.value.trim();
    if (!id) { idIn.focus(); return; }
    fleetDraft.push({ id, name: name || id, oos: false });
    idIn.value = '';
    nameIn.value = '';
    renderFleetPanel();
  });

  addRow.appendChild(idIn);
  addRow.appendChild(nameIn);
  addRow.appendChild(addBtn);
  addSec.appendChild(addRow);
  body.appendChild(addSec);
}

document.getElementById('fleetBtn').addEventListener('click', openFleet);
document.getElementById('fleetClose').addEventListener('click', closeFleet);
document.getElementById('fleetCancelBtn').addEventListener('click', closeFleet);
document.getElementById('fleetSaveBtn').addEventListener('click', () => {
  state.trucks = fleetDraft.map(t => ({...t}));
  saveState();
  closeFleet();
  render();
});
document.getElementById('fleetOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeFleet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeFleet(); closeAllPopups(); }
});

// ─── UTILS ────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
